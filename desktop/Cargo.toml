[package]
name = "termnest-desktop"
version = "1.1.8"
license = "MIT"
repository = "https://github.com/jiaqing-l/termnest"
description = "Termnest desktop application, by JIAQING"
edition = "2021"
rust-version = "1.98"

[[bin]]
name = "Termnest"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.2"
serde_json = "=1.0.154"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-clipboard-manager = "=2.5.0"
