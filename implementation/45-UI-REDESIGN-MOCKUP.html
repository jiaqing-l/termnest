<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERMNEST · Mockup giao diện mới</title>
<style>
/* ───────── Design tokens: 8px grid · 1 màu chủ đạo · màu ngữ nghĩa có ý nghĩa ───────── */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F8FB; --line:#E6E9F0; --line-2:#D9DEE8;
  --ink:#121826; --ink-2:#4A5468; --ink-3:#8A93A6;
  --primary:#4F5BD5; --primary-ink:#fff; --primary-soft:#ECEEFC; --primary-line:#C9CEF5;
  --ok:#1E9E6A; --ok-soft:#E3F6EE; --warn:#C98512; --warn-soft:#FDF2DA; --bad:#D6453D; --bad-soft:#FCE9E7;
  --term:#0F1424; --term-2:#161C31; --term-ink:#D7DCEC; --term-dim:#7C86A5;
  --hero:linear-gradient(120deg,#F9D8CF 0%,#F6E3C8 45%,#E4E3F8 100%);
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:24px;
  --sh:0 1px 2px rgba(18,24,38,.04),0 8px 24px rgba(18,24,38,.06);
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
}
:root[data-theme=dark]{
  --bg:#0B0F1A; --surface:#141A2B; --surface-2:#10162A; --line:#232B42; --line-2:#2D3752;
  --ink:#EEF1F8; --ink-2:#A9B2C8; --ink-3:#6F7A94;
  --primary:#7C86F2; --primary-ink:#0B0F1A; --primary-soft:#1E2442; --primary-line:#343E7A;
  --ok:#3CC58C; --ok-soft:#13322A; --warn:#E6AE3A; --warn-soft:#3A2D10; --bad:#F0736B; --bad-soft:#3B1A18;
  --term:#080B15; --term-2:#0E1324;
  --hero:linear-gradient(120deg,#3A2A3E 0%,#3B3040 45%,#262C58 100%);
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.45 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ───────── Khung xem mockup ───────── */
.viewer{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.vnav{position:sticky;top:0;height:100vh;overflow:auto;padding:24px 16px;background:var(--surface);border-right:1px solid var(--line)}
.vnav h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.vnav p{color:var(--ink-3);font-size:12px;margin-bottom:16px}
.vnav h5{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:20px 8px 8px}
.vnav a{display:flex;gap:8px;align-items:center;padding:8px;border-radius:var(--r-s);color:var(--ink-2);text-decoration:none;font-size:13px;cursor:pointer}
.vnav a:hover{background:var(--surface-2)}
.vnav a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.vnav .tt{display:flex;gap:8px;margin-top:16px}
.vnav .tt button{flex:1;padding:8px;border:1px solid var(--line-2);border-radius:var(--r-s);font-size:12px}
.vnav .tt button.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.stage{padding:32px;overflow:auto}
.stage .cap{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px;gap:16px}
.stage .cap h2{font-size:22px;letter-spacing:-.01em}
.stage .cap p{color:var(--ink-2);font-size:13px;max-width:760px;margin-top:4px}
.note{background:var(--primary-soft);border:1px solid var(--primary-line);color:var(--ink);padding:12px 16px;border-radius:var(--r-m);font-size:13px;margin-top:16px;max-width:980px}
.note b{color:var(--primary)}

/* ───────── Ứng dụng TERMNEST (khung 1280×800) ───────── */
.win{width:1280px;flex:none;height:800px;background:var(--bg);border-radius:var(--r-xl);box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden;display:grid;grid-template-rows:64px 1fr;position:relative}
.top{display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.08em;font-size:15px}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:var(--bg);font-style:normal;font-size:13px}
.quota{display:flex;gap:8px;margin-left:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--ink-2);white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:var(--r-m);display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);position:relative}
.ib:hover{background:var(--surface-2)}
.ib .bd{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-weight:600}
.btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:12px;border-radius:var(--r-s)}
.body{display:grid;grid-template-columns:288px 1fr;min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.side h6{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:16px 8px 4px;display:flex;justify-content:space-between}
.srv,.ses{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--r-m);cursor:pointer}
.srv:hover,.ses:hover{background:var(--surface-2)}
.srv.on,.ses.on{background:var(--primary-soft)}
.av{width:36px;height:36px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;position:relative;flex:none}
.av .dot{position:absolute;right:-2px;bottom:-2px;border:2px solid var(--surface);width:12px;height:12px}
.srv b,.ses b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.srv small,.ses small{display:block;color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:156px}
.cnt{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.cnt.ok{background:var(--ok-soft);color:var(--ok)}
.health{margin-top:auto;border:1px solid var(--line);border-radius:var(--r-m);padding:12px;display:grid;gap:8px;font-size:12px;color:var(--ink-2)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:3px}
.meter i.w{background:var(--warn)}.meter i.b{background:var(--bad)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.nav{display:flex;align-items:center;gap:16px;padding:16px 24px 0}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:4px;gap:4px;margin-left:auto}
.seg button{padding:8px 16px;border-radius:var(--r-m);color:var(--ink-2);font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.seg button em{font-style:normal;background:var(--warn-soft);color:var(--warn);border-radius:9px;font-size:11px;padding:0 6px;font-weight:700}
.seg button.on em{background:rgba(255,255,255,.25);color:#fff}
.page{flex:1;min-height:0;overflow:hidden;padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);padding:16px}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card h3 span{font-weight:500;color:var(--ink-3);font-size:12px}
.hero{border-radius:var(--r-xl);background:var(--hero);padding:24px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden;min-height:136px}
.hero h1{font-size:26px;letter-spacing:-.02em}
.hero p{color:var(--ink-2);margin:4px 0 16px}
.hero .orb{position:absolute;right:48px;top:-24px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff8 0,#fff0 60%),conic-gradient(from 200deg,#F4B6A6,#F6D49A,#C9CDF8,#F4B6A6);opacity:.9;filter:blur(.5px)}
.hero .orb.s{right:220px;top:60px;width:96px;height:96px;opacity:.7}
.chips{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.chip{padding:4px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.chip.partial{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi small{color:var(--ink-3);font-size:12px}
.kpi b{display:block;font-size:28px;letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.kpi span{font-size:12px;font-weight:600}
.kpi span.up{color:var(--ok)}.kpi span.dn{color:var(--bad)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.tools{display:flex;gap:8px;align-items:center}
.input{height:40px;border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--surface);padding:0 12px;display:flex;align-items:center;gap:8px;color:var(--ink-3);min-width:240px}
.f-chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center}
.f-chip.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-line)}
.scard{display:flex;flex-direction:column;gap:12px}
.scard .hd{display:flex;gap:12px;align-items:center}
.scard .hd b{font-size:14px}.scard .hd small{color:var(--ink-3);font-size:12px;display:block}
.tag{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:4px;padding:0 8px;height:22px;border-radius:11px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.pri{background:var(--primary-soft);color:var(--primary)}
.snip{background:var(--term);color:var(--term-ink);border-radius:var(--r-s);padding:8px 12px;font:12px/1.5 var(--mono);height:64px;overflow:hidden;white-space:pre}
.ctx{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
.ctx div{display:flex;justify-content:space-between}
/* terminal */
.thead{display:flex;align-items:center;gap:12px;min-width:0}
.thead h2{font-size:18px;letter-spacing:-.01em}
.wchips{display:flex;gap:8px}
.wchip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:12px}
.tbody{flex:1;min-height:0;display:grid;gap:16px}
.term{background:var(--term);border-radius:var(--r-l);color:var(--term-ink);font:12.5px/1.6 var(--mono);padding:16px;overflow:hidden;position:relative;border:1px solid #232B48}
.term .l{white-space:pre-wrap}
.term .g{color:#5AD1A0}.term .y{color:#E6C26A}.term .r{color:#F28B82}.term .d{color:var(--term-dim)}.term .b{color:#8FA2FF}
.term .tb{position:absolute;right:16px;top:16px;font-size:11px;color:var(--term-dim);background:#1A2140;padding:0 8px;border-radius:6px}
.term .jump{position:absolute;right:16px;bottom:16px;background:var(--primary);color:var(--primary-ink);padding:8px 16px;border-radius:999px;font:600 12px var(--font)}
.dock{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dock .btn{height:32px;font-size:12px;border-radius:var(--r-s);padding:0 12px}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:grid;gap:16px;align-content:start;overflow:hidden}
.detail h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.ring{--p:57;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:12px}.kv span{color:var(--ink-3)}.kv b{text-align:right;font-weight:600}
/* worker pane */
.wp{background:var(--term);border:1px solid #232B48;border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.wp .h{white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--term-2);color:var(--term-ink);font-size:12px;border-bottom:1px solid #232B48}
.wp .h b{font-weight:700}
.wp .h .k{background:#1D3B33;color:#5AD1A0;border-radius:6px;padding:0 8px;font-weight:600}
.wp .h .s{flex:none;margin-left:auto;color:var(--term-dim)}
.wp .f{padding:12px;font:12px/1.55 var(--mono);color:var(--term-ink);overflow:hidden;display:grid;gap:4px;align-content:start}
.wp .f div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp .f .ex{color:#C9D1F0}.wp .f .ed{color:#E6C26A}.wp .f .sy{color:#8FA2FF}.wp .f .ok{color:#5AD1A0}.wp .f .no{color:#F28B82}
/* tables / lists */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--line)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:96px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:4px}
.bar i.ok{background:var(--ok)}.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0}
.mut{color:var(--ink-3);font-size:12px}
.chart{height:168px;display:flex;align-items:end;gap:8px;padding-top:8px}
.chart i{flex:1;background:var(--primary-soft);border-radius:6px 6px 0 0;position:relative;min-height:8px}
.chart i.hi{background:var(--primary)}
.chart i.ac{background:var(--warn)}
.axis{display:flex;gap:8px;color:var(--ink-3);font-size:11px}.axis span{flex:1;text-align:center}
.notes{display:grid;grid-template-columns:272px 1fr;gap:16px;flex:1;min-height:0}
.nlist{display:grid;gap:8px;align-content:start}
.nitem{padding:12px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface)}
.nitem.on{border-color:var(--primary-line);background:var(--primary-soft)}
.nitem b{display:block;font-size:13px}.nitem small{color:var(--ink-3);font-size:12px}
.editor h2{font-size:22px;margin-bottom:8px;letter-spacing:-.01em}
.editor p,.editor li{color:var(--ink-2);margin-bottom:8px}
.editor code{background:var(--surface-2);border:1px solid var(--line);padding:0 4px;border-radius:4px;font:12px var(--mono)}
.timeline{display:grid;gap:12px}
.tl{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:start}
.tl i{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:6px}
.tl i.ok{background:var(--ok)}.tl i.bad{background:var(--bad)}.tl i.w{background:var(--warn)}
/* settings + dialogs */
.set{display:grid;grid-template-columns:200px 1fr;gap:24px;flex:1;min-height:0}
.setnav{display:grid;gap:4px;align-content:start}
.setnav a{padding:8px 12px;border-radius:var(--r-m);color:var(--ink-2);font-weight:600;font-size:13px}
.setnav a.on{background:var(--primary-soft);color:var(--primary)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}.srow small{display:block;color:var(--ink-3);font-size:12px}
.sw{width:44px;height:24px;border-radius:12px;background:var(--line-2);position:relative;flex:none}
.sw:after{content:'';position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003}
.sw.on{background:var(--primary)}.sw.on:after{left:22px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.theme{border:2px solid var(--line);border-radius:var(--r-m);padding:8px;display:grid;gap:8px;font-size:12px;font-weight:600}
.theme.on{border-color:var(--primary)}
.theme i{height:48px;border-radius:8px;display:block}
.scrim{position:absolute;inset:64px 0 0 0;background:rgba(10,14,26,.45);display:grid;place-items:center;backdrop-filter:blur(2px)}
.dlg{width:480px;background:var(--surface);border-radius:var(--r-xl);box-shadow:0 24px 64px rgba(0,0,0,.28);padding:24px;display:grid;gap:16px}
.dlg h2{font-size:18px;letter-spacing:-.01em}
.dlg .fld{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.dlg .fld div{height:40px;border:1px solid var(--line-2);border-radius:var(--r-m);padding:0 12px;display:flex;align-items:center;color:var(--ink);font-weight:500;font-size:13px;background:var(--surface)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.dlg .hint{font-size:12px;color:var(--ink-3)}
.dlgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.dlgs .box{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-xl);padding:32px;display:grid;place-items:center}
.dlgs .dlg{width:100%}
/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;height:100%}
.login .art{background:linear-gradient(150deg,#2E3A9E,#5B67E0 55%,#B7A6F0);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .art h1{font-size:34px;line-height:1.15;letter-spacing:-.02em;max-width:420px}
.login .art p{opacity:.85;max-width:380px;margin-top:16px}
.login .art .orb{position:absolute;right:-60px;bottom:-60px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff6,#fff0 65%),conic-gradient(#fff3,#fff0,#fff3)}
.login .form{display:grid;place-items:center;background:var(--surface)}
.login .form .dlg{box-shadow:none;width:360px;padding:0}
/* mobile */
.phones{display:flex;gap:32px;flex-wrap:wrap}
.phone{width:390px;height:780px;border-radius:40px;background:var(--bg);border:8px solid var(--ink);overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;box-shadow:var(--sh)}
.phone .ph{padding:16px;background:var(--surface);border-bottom:1px solid var(--line);display:grid;gap:8px}
.phone .pb{padding:16px;display:grid;gap:12px;align-content:start;overflow:hidden}
.phone .tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 0 16px}
.phone .tabbar a{display:grid;justify-items:center;gap:2px;font-size:10px;color:var(--ink-3);font-weight:600}
.phone .tabbar a.on{color:var(--primary)}
.keys{display:flex;gap:8px;overflow:hidden}
/* design system */
.ds{display:grid;gap:24px;max-width:1120px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.sw1{border-radius:var(--r-m);border:1px solid var(--line);overflow:hidden;font-size:12px}
.sw1 i{display:block;height:56px}.sw1 div{padding:8px;background:var(--surface)}.sw1 b{display:block}.sw1 span{color:var(--ink-3)}
.t1{font-size:28px;font-weight:800;letter-spacing:-.02em}.t2{font-size:18px;font-weight:700}.t3{font-size:14px;font-weight:600}.t4{font-size:13px;color:var(--ink-2)}.t5{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.space{display:flex;gap:16px;align-items:end}.space div{background:var(--primary-soft);border:1px dashed var(--primary);text-align:center;font-size:11px;color:var(--primary);padding-top:4px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cmp .bad,.cmp .good{border-radius:var(--r-l);padding:16px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.cmp h5{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:13px}
.cmp .x{color:var(--bad)}.cmp .v{color:var(--primary)}
@media (max-width:760px){.viewer{grid-template-columns:1fr}.vnav{position:static;height:auto}.stage{padding:16px}}
</style>

  <div class="card"><h3>2 · Chữ — mỗi kiểu một mục đích</h3><div style="display:grid;gap:8px"><div class="t1">Tiêu đề trang 28/800</div><div class="t2">Tiêu đề thẻ 18/700</div><div class="t3">Nhãn & giá trị 14/600</div><div class="t4">Nội dung phụ 13/400 · màu ink-2</div><div class="t5">Nhãn nhóm 11 · hoa · giãn chữ</div><div style="font:12.5px var(--mono)">Terminal 12.5 mono</div></div></div>
  <div class="card"><h3>3 · Màu — ít màu, nhiều rõ ràng</h3><div class="swatches">${[['Chủ đạo', '--primary'], ['Nền chủ đạo', '--primary-soft'], ['Thành công', '--ok'], ['Cảnh báo', '--warn'], ['Lỗi', '--bad'], ['Terminal', '--term']].map((c) => `<div class="sw1"><i style="background:var(${c[1]})"></i><div><b>${c[0]}</b><span>${c[1]}</span></div></div>`).join('')}</div><p class="t4" style="margin-top:12px">Màu ngữ nghĩa chỉ dùng cho trạng thái (đang chạy · chờ · lỗi). Không dùng màu trang trí.</p></div>
  <div class="cmp"><div class="bad"><h5><span class="x">✕</span><b>Hiện tại</b></h5><div class="t4">Nhiều màu nhấn cùng lúc, thú cưng chuyển động liên tục, chip kết nối xanh dù có máy chủ mất kết nối, pane thợ chỉ có log thô.</div></div><div class="good"><h5><span class="v">✓</span><b>Đề xuất</b></h5><div class="t4">Một màu chủ đạo, chip kết nối vàng khi thiếu máy, chuyển động chỉ khi cần (và tắt được), pane thợ hiện lệnh/tệp/lời thật của Codex.</div></div></div></div>` };

/* ───────── Khung xem ───────── */
const ORDER = ['ds', 'login', 'over', 'focus', 'crew', 'wall', 'token', 'notes', 'ops1', 'ops2', 'ops3', 'set', 'dialogs', 'mobile'];
let cur = (location.hash || '#over').slice(1); if (!SCREENS[cur]) cur = 'over';
var render = function () {
  const groups = {}; ORDER.forEach((k) => (groups[SCREENS[k].g] ||= []).push(k));
  const theme = document.documentElement.dataset.theme === 'dark';
  document.getElementById('vnav').innerHTML = `<h1>TERMNEST</h1><p>Mockup giao diện mới · ${ORDER.length} màn</p>` +
    Object.entries(groups).map(([g, ks]) => `<h5>${g}</h5>` + ks.map((k) => `<a class="${k === cur ? 'on' : ''}" data-k="${k}">${SCREENS[k].t}</a>`).join('')).join('') +
    `<div class="tt"><button class="${theme ? '' : 'on'}" data-th="light">Sáng</button><button class="${theme ? 'on' : ''}" data-th="dark">Tối</button></div>`;
  const s = SCREENS[cur];
  document.getElementById('stage').innerHTML = `<div class="cap"><div><h2>${s.t}</h2><p>${s.d}</p></div></div>${s.f()}`;
  document.title = 'TERMNEST · ' + s.t;
};
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-k]'); if (a) { cur = a.dataset.k; location.hash = cur; render(); return; }
  const t = e.target.closest('[data-th]'); if (t) { document.documentElement.dataset.theme = t.dataset.th; render(); }
});
// The 1280px window is scaled down to fit narrow browser windows instead of being cut off on the right.
function fit() {
  const st = document.getElementById('stage'), w = st.querySelector('.win'); if (!w) return;
  w.style.zoom = Math.min(1, (st.clientWidth - 64) / 1280);
}
const _render = render; render = function () { _render(); fit(); };
addEventListener('resize', fit);
render();
</script>
</body>
