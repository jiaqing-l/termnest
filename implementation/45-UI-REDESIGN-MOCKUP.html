<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERMNEST · Giao diện mới (mockup bấm được)</title>
<style>
/* ───────── Màu: trung tính + #20285a (chủ đạo) + #d32027 (nhấn) + màu trạng thái ───────── */
:root{
  --brand:#20285a; --brand-2:#2D3880; --brand-ink:#fff; --brand-soft:#E9EBF5; --brand-line:#C5CAE6;
  --accent:#d32027; --accent-ink:#fff; --accent-soft:#FCE8E9;
  --bg:#F3F4F8; --surface:#fff; --surface-2:#F7F8FB; --line:#E4E7F0; --line-2:#D3D8E6;
  --ink:#141833; --ink-2:#4B5272; --ink-3:#8790AB;
  --ok:#1E9E6A; --ok-soft:#E3F6EE; --warn:#C98512; --warn-soft:#FDF2DA; --bad:#d32027; --bad-soft:#FCE8E9;
  --term:#0C1030; --term-2:#141A44; --term-ink:#DCE0F5; --term-dim:#7F89B3; --term-line:#252C5E;
  --hero:linear-gradient(115deg,#20285a 0%,#2D3880 55%,#4650B0 100%);
  --sh:0 1px 2px rgba(20,24,51,.05),0 6px 20px rgba(20,24,51,.06);
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:24px;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
  --term-size:13.5px;
}
:root[data-theme=dark]{
  --brand:#8E9AF5; --brand-2:#A5AFFA; --brand-ink:#0B0E24; --brand-soft:#1F2552; --brand-line:#3A4285;
  --accent:#F0555B; --accent-soft:#3A1B1E;
  --bg:#0A0D22; --surface:#111634; --surface-2:#0E1230; --line:#222A58; --line-2:#2F3870;
  --ink:#EEF0FB; --ink-2:#AAB2D6; --ink-3:#6F79A3;
  --ok:#3CC58C; --ok-soft:#12342B; --warn:#E6AE3A; --warn-soft:#3A2D10; --bad:#F0555B; --bad-soft:#3A1B1E;
  --term:#070920; --term-2:#0C1030; --term-line:#1E2552;
  --hero:linear-gradient(115deg,#1B2260 0%,#262F84 55%,#3A45B5 100%);
  --sh:0 1px 2px rgba(0,0,0,.35),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.45 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nowrap{white-space:nowrap}
.sp{flex:1}
.mut{color:var(--ink-3);font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.hide{display:none!important}

/* ───────── Khung ứng dụng: chiếm cả màn hình như TERMNEST thật ───────── */
.app{height:100vh;display:grid;grid-template-rows:64px minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.top{display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.top .lock{height:38px;display:block;cursor:pointer}
.quota{display:flex;gap:8px;min-width:0;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.pill b{color:var(--ink);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.ib{width:42px;height:42px;border-radius:var(--r-m);display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);position:relative;flex:none}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib .bd{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.btn:hover{background:var(--surface-2)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.brand:hover{background:var(--brand-2)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.accent:hover{filter:brightness(1.08)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:var(--r-s)}
.btn.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand)}
.body{display:grid;grid-template-columns:304px minmax(0,1fr);min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;overflow:auto;padding:12px 16px}
.side h6{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:16px 8px 6px;display:flex;justify-content:space-between;font-weight:700}
.item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--r-m);cursor:pointer;border:1px solid transparent}
.item:hover{background:var(--surface-2)}
.item.on{background:var(--brand-soft);border-color:var(--brand-line)}
.av{width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;position:relative;flex:none}
.av .dot{position:absolute;right:-3px;bottom:-3px;border:2px solid var(--surface);width:13px;height:13px}
.item b{display:block;font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .txt{min-width:0;flex:1}
.cnt{min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 7px}
.cnt.soft{background:var(--brand-soft);color:var(--brand)}
.health{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:8px;font-size:12.5px;color:var(--ink-2)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:3px}
.meter i.w{background:var(--warn)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.nav{display:flex;align-items:center;padding:16px 24px 0;gap:16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:4px;gap:4px}
.seg button{padding:9px 18px;border-radius:var(--r-m);color:var(--ink-2);font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.seg button em{font-style:normal;background:var(--accent);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:700}
.page{flex:1;min-height:0;overflow:auto;padding:16px 24px 24px;display:flex;flex-direction:column;gap:16px}
.page.fill{overflow:hidden}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);padding:16px;min-width:0}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card h3 span{font-weight:500;color:var(--ink-3);font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:0 10px;height:24px;border-radius:12px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;flex:none}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.pri{background:var(--brand-soft);color:var(--brand)}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip.partial{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.input{height:42px;border:1px solid var(--line-2);border-radius:var(--r-m);background:var(--surface);padding:0 14px;display:flex;align-items:center;gap:8px;color:var(--ink-3);min-width:0}
.input input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}
.input:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
/* hero */
.hero{border-radius:var(--r-xl);background:var(--hero);padding:28px;color:#fff;position:relative;overflow:hidden;flex:none}
.hero h1{font-size:28px;letter-spacing:-.02em}
.hero p{opacity:.85;margin:4px 0 16px}
.hero .orb{position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d32027cc,#d3202700 70%)}
.hero .orb.b{right:140px;top:50px;width:120px;height:120px;background:radial-gradient(circle,#ffffff30,#ffffff00 70%)}
.hero .chip{background:#ffffff1c;border-color:#ffffff30;color:#fff}
.hero .chip.partial{background:#fff;color:var(--warn)}
.hero .row{flex-wrap:wrap;position:relative;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.scard{cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:transform .12s,box-shadow .12s}
.scard:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(20,24,51,.12)}
.scard.wait{border-color:var(--warn)}
.scard.idle{opacity:.75}
.snip{background:var(--term);color:var(--term-ink);border-radius:var(--r-s);padding:10px 12px;font:12.5px/1.5 var(--mono);height:70px;overflow:hidden;white-space:pre}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--accent)}.bar i.ok{background:var(--ok)}
/* tabs of terminal */
.stabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.stabs a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px 12px 0 0;font-weight:600;font-size:14px;color:var(--ink-2);border:1px solid transparent;border-bottom:0;margin-bottom:-1px;white-space:nowrap;cursor:pointer}
.stabs a:hover{background:var(--surface-2)}
.stabs a.on{background:var(--surface);color:var(--brand);border-color:var(--line);box-shadow:0 2px 0 var(--accent) inset}
.stabs a em{font-style:normal;background:var(--brand-soft);color:var(--brand);border-radius:9px;padding:0 7px;font-size:11.5px;font-weight:700}
.stabs a i{display:inline-grid;color:var(--ink-3);border-radius:6px;padding:2px}.stabs a i:hover{background:var(--line);color:var(--ink)}
/* session view */
.sv{flex:1;min-height:0;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.sv.det{grid-template-columns:minmax(0,1fr) 320px}
.sv-main{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.thead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.thead h2{font-size:19px;letter-spacing:-.01em}
.wchip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:13px}
.wchip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.term{background:var(--term);border:1px solid var(--term-line);border-radius:var(--r-l);color:var(--term-ink);font:var(--term-size)/1.6 var(--mono);overflow:hidden;position:relative;display:flex;flex-direction:column;min-height:0}
.term .out{flex:1;min-height:0;overflow:auto;padding:16px;white-space:pre-wrap;word-break:break-word}
.term .tb{position:absolute;right:14px;top:12px;font-size:11px;color:var(--term-dim);background:var(--term-2);padding:2px 8px;border-radius:6px;pointer-events:none}
.term .jump{position:absolute;right:16px;bottom:64px;background:var(--accent);color:#fff;padding:8px 16px;border-radius:999px;font:600 12.5px var(--font);box-shadow:0 6px 16px #0006}
.term .in{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--term-line);background:var(--term-2)}
.term .in b{color:var(--accent);font-weight:700}
.term .in input{flex:1;background:transparent;border:0;outline:0;color:var(--term-ink);font:inherit}
.term .g{color:#5AD1A0}.term .y{color:#E6C26A}.term .r{color:#FF7A80}.term .d{color:var(--term-dim)}.term .b{color:#9AA6FF}
.dock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative}
.menu{position:absolute;bottom:44px;left:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--sh);padding:6px;z-index:20;min-width:260px}
.menu a{display:block;padding:8px 12px;border-radius:var(--r-s);cursor:pointer;font-size:13px}
.menu a:hover{background:var(--brand-soft)}
.workers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));height:230px;flex:none}
.wp{background:var(--term);border:1px solid var(--term-line);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column;min-height:0;cursor:pointer}
.wp.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.wp.fail{border-color:var(--accent)}
.wp .h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--term-2);color:var(--term-ink);font-size:12.5px;border-bottom:1px solid var(--term-line);white-space:nowrap;overflow:hidden}
.wp .h b{font-weight:700}
.wp .h .k{background:#1D3B33;color:#5AD1A0;border-radius:6px;padding:0 8px;font-weight:600;flex:none}
.wp .h .s{margin-left:auto;color:var(--term-dim);flex:none}
.wp .f{padding:10px 12px;font:12.5px/1.55 var(--mono);color:var(--term-ink);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;flex:1}
.wp .f div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp .f .ex{color:#C9D1F0}.wp .f .ed{color:#E6C26A}.wp .f .sy{color:#9AA6FF}.wp .f .ok{color:#5AD1A0}.wp .f .no{color:#FF7A80}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:grid;gap:20px;align-content:start;overflow:auto}
.detail h4{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;font-weight:700}
.ring{--p:57;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}.kv span{color:var(--ink-3)}.kv b{text-align:right;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;overflow:auto;padding-bottom:8px}
.tile{cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:14px}
.tile:hover{border-color:var(--brand-line)}
.tile.wait{border-color:var(--warn)}.tile.idle{opacity:.7}
.tile .hd{display:flex;align-items:center;gap:8px;font-weight:700;overflow:hidden;white-space:nowrap}
.tile .hd small{margin-left:auto;font-weight:500;color:var(--ink-3);font-size:12px}
.tile .snip{height:60px}
/* data views */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi small{color:var(--ink-3);font-size:12.5px}
.kpi b{display:block;font-size:30px;letter-spacing:-.02em;line-height:1.2;margin-top:4px}
.kpi span{font-size:12.5px;font-weight:600}.up{color:var(--ok)}.dn{color:var(--accent)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.chart{height:200px;display:flex;align-items:end;gap:8px;padding-top:8px}
.chart i{flex:1;background:var(--brand-soft);border-radius:6px 6px 0 0;min-height:8px;cursor:pointer;transition:height .3s}
.chart i:hover{background:var(--brand-line)}
.chart i.hi{background:var(--brand)}.chart i.ac{background:var(--accent)}
.axis{display:flex;gap:8px;color:var(--ink-3);font-size:11.5px}.axis span{flex:1;text-align:center}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:8px;border-bottom:1px solid var(--line);font-weight:700}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--line)}
.tbl tr.pick{cursor:pointer}.tbl tr.pick:hover td{background:var(--surface-2)}
.notes{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;flex:1;min-height:0}
.nlist{display:grid;gap:8px;align-content:start;overflow:auto}
.nitem{padding:12px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);cursor:pointer}
.nitem.on{border-color:var(--brand);background:var(--brand-soft)}
.nitem b{display:block;font-size:14px}.nitem small{color:var(--ink-3);font-size:12.5px}
.editor{display:flex;flex-direction:column;gap:12px;min-height:0}
.editor input.ti{font-size:22px;font-weight:800;border:0;outline:0;background:transparent;letter-spacing:-.01em;width:100%}
.editor textarea{flex:1;border:1px solid var(--line);border-radius:var(--r-m);padding:14px;resize:none;outline:0;background:var(--surface-2);line-height:1.6;min-height:200px}
.timeline{display:grid;gap:14px}
.tl{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:start}
.tl i{width:10px;height:10px;border-radius:50%;background:var(--brand);margin-top:6px}
.tl i.ok{background:var(--ok)}.tl i.bad{background:var(--accent)}.tl i.w{background:var(--warn)}
.subseg{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:4px}
.subseg button{padding:7px 14px;border-radius:var(--r-s);font-weight:600;font-size:13px;color:var(--ink-2)}
.subseg button.on{background:var(--brand-soft);color:var(--brand)}
/* dialogs */
.scrim{position:fixed;inset:0;background:rgba(10,13,34,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:var(--r-xl);box-shadow:0 24px 64px rgba(0,0,0,.35);padding:24px;display:grid;gap:16px}
.dlg.wide{width:min(920px,100%)}
.dlg h2{font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:12px}
.fld{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.fld input,.fld select{height:42px;border:1px solid var(--line-2);border-radius:var(--r-m);padding:0 12px;background:var(--surface);color:var(--ink);font-weight:500;outline:0}
.fld input:focus,.fld select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.acts{display:flex;justify-content:flex-end;gap:8px}
.hint{font-size:12.5px;color:var(--ink-3)}
.set{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px}
.setnav{display:grid;gap:4px;align-content:start}
.setnav a{padding:9px 12px;border-radius:var(--r-m);color:var(--ink-2);font-weight:600;cursor:pointer}
.setnav a.on{background:var(--brand-soft);color:var(--brand)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}.srow small{display:block;color:var(--ink-3);font-size:12.5px}
.sw{width:46px;height:26px;border-radius:13px;background:var(--line-2);position:relative;flex:none;cursor:pointer;transition:background .15s}
.sw:after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:left .15s}
.sw.on{background:var(--brand)}.sw.on:after{left:23px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.theme{border:2px solid var(--line);border-radius:var(--r-m);padding:8px;display:grid;gap:8px;font-weight:600;cursor:pointer;font-size:13px}
.theme.on{border-color:var(--brand)}
.theme i{height:52px;border-radius:8px;display:block;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:80;box-shadow:0 10px 30px #0005}
/* login */
.login{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:1.1fr 1fr;background:var(--surface)}
.login .art{background:var(--hero);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .art h1{font-size:38px;line-height:1.15;letter-spacing:-.02em;max-width:460px}
.login .art p{opacity:.85;max-width:400px;margin-top:16px;font-size:15px}
.login .art .orb{position:absolute;right:-80px;bottom:-80px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d32027cc,#d3202700 70%)}
.login .form{display:grid;place-items:center;padding:24px}
.login .form .box{width:min(380px,100%);display:grid;gap:16px}

:root{--z:.8}
html{zoom:var(--z)}
.app{height:calc(100vh / var(--z))}
.body.mini{grid-template-columns:80px minmax(0,1fr)}
.mini .txt,.mini .cnt,.mini .side h6,.mini .health{display:none}
.mini .item{justify-content:center}
.sidehead{display:flex;align-items:center;padding:12px 16px 0}
.fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.fcard{cursor:pointer;display:grid;gap:10px}
.fcard:hover{border-color:var(--brand-line)}
.fcard.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.fcard .m{display:grid;grid-template-columns:44px 1fr 40px;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:24px}
.scene{display:flex;align-items:center;gap:14px;margin-right:24px}
.scene .box{width:60px;height:60px;border-radius:18px;background:#ffffff22;border:1px solid #ffffff40;display:grid;place-items:center;color:#fff}
.scene .wire{display:flex;gap:6px}.scene .wire i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.35;animation:wi 1.4s infinite}
.scene .wire i:nth-child(2){animation-delay:.2s}.scene .wire i:nth-child(3){animation-delay:.4s}
@keyframes wi{50%{opacity:1;background:#ff6b70}}
@media (prefers-reduced-motion:reduce){.scene .wire i{animation:none}}
.yard{display:flex;gap:18px;align-items:flex-end;min-height:64px;overflow:hidden;padding:8px 4px}
.yard span{font-size:34px;cursor:pointer;transition:transform .2s}.yard span:hover{transform:translateY(-8px) rotate(-6deg)}
.tmux{background:#2e9b4f;color:#06210f;font:12px var(--mono);padding:2px 14px;display:flex;justify-content:space-between;flex:none}
.upfab{position:absolute;left:16px;bottom:96px;width:38px;height:38px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 6px 16px #0006;cursor:pointer}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r-m);padding:8px 14px;font-weight:600;font-size:13px}
.splits{display:grid;gap:12px;flex:1;min-height:0}
.splits.l2{grid-template-columns:1fr 1fr}.splits.l4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.kbd{display:flex;gap:8px;flex-wrap:wrap;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.pgrid span{font-size:28px;text-align:center;padding:8px;border:2px solid var(--line);border-radius:var(--r-m);cursor:pointer}.pgrid span.on{border-color:var(--brand);background:var(--brand-soft)}
.files{display:grid;gap:4px;align-content:start}.files a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-s);cursor:pointer}.files a:hover,.files a.on{background:var(--brand-soft)}
.crumb{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.drop{border:2px dashed var(--line-2);border-radius:var(--r-l);padding:32px;text-align:center;color:var(--ink-2)}
.rng{width:100%;accent-color:var(--brand)}
.plain{padding:12px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface-2);font:12.5px/1.6 var(--mono);white-space:pre-wrap}
.fsm .top,.fsm .side,.fsm .nav,.fsm .stabs,.fsm .tabbar{display:none}.fsm .body{grid-template-columns:1fr}.fsm.app{grid-template-rows:0 minmax(0,1fr)}
.fsx{position:fixed;top:12px;right:12px;z-index:60}
select{height:42px;border:1px solid var(--line-2);border-radius:12px;padding:0 10px;background:var(--surface);color:var(--ink)}
.fld select{width:100%}
@media (max-width:860px){:root{--z:1}.body.mini{grid-template-columns:minmax(0,1fr)}.hero{flex-direction:column;align-items:flex-start}.scene{display:none}.splits.l2,.splits.l4{grid-template-columns:1fr}}
/* mobile */
.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-rows:56px minmax(0,1fr) 64px}
  .top{padding:0 12px;gap:8px}.quota,.top .lock+.sp~.hide-m,.hide-m{display:none}
  .top .lock{height:30px}
  .body{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:56px 0 64px 0;z-index:40;transform:translateX(-100%);transition:transform .2s;width:min(340px,92vw)}
  .side.open{transform:none;box-shadow:0 0 0 100vw rgba(10,13,34,.5)}
  .nav{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
  .tabbar a{display:grid;justify-items:center;align-content:center;gap:2px;font-size:11px;color:var(--ink-3);font-weight:600;cursor:pointer}
  .tabbar a.on{color:var(--brand)}
  .page{padding:12px}
  .sv.det{grid-template-columns:minmax(0,1fr)}.detail{display:none}
  .grid2,.notes,.set{grid-template-columns:minmax(0,1fr)}
  .workers{height:auto;grid-template-columns:1fr}.wp{height:150px}
  .btn{height:40px;padding:0 14px}
  .login{grid-template-columns:1fr}.login .art{display:none}
  .hero{padding:20px}.hero h1{font-size:22px}
}
</style>
</head>

  else if (a === 'sw') SW[id] = !SW[id];
  else if (a === 'ops') state.opsTab = Number(id);
  else if (a === 'range') state.range = Number(id);
  else if (a === 'note') state.noteId = Number(id);
  else if (a === 'newnote') { const n = { id: Date.now(), t: 'Ghi chú mới', s: 'Vừa xong', b: '' }; NOTES.unshift(n); state.noteId = n.id; }
  else if (a === 'mini') state.mini = !state.mini;
  else if (a === 'reopen') { const id2 = state.closed.pop(); if (id2 && sess(id2)) { state.open.push(id2); state.tab = id2; } }
  else if (a === 'bellS') { const s = state.tab; state.bellS[s] = !state.bellS[s]; toast(state.bellS[s] ? 'Sẽ báo khi phiên này chờ bạn' : 'Đã tắt báo cho phiên này'); return; }
  else if (a === 'layout') state.layout = Number(id);
  else if (a === 'kb') state.kb = !state.kb;
  else if (a === 'sel') state.sel = !state.sel;
  else if (a === 'newline') { const i = document.getElementById('tinput'); if (i) i.value += ' ⏎ '; return; }
  else if (a === 'key') { state.menu = false; sess(state.tab).lines.push('<span class="d">[' + id + ']</span>'); }
  else if (a === 'fsreset') state.fs = 13.5;
  else if (a === 'fsmode') state.fsMode = !state.fsMode;
  else if (a === 'zoom') state.zoom = Number(id);
  else if (a === 'offline') state.offline = !state.offline;
  else if (a === 'readall') { state.alertsRead = true; }
  else if (a === 'rangeM') state.rangeM = id;
  else if (a === 'hostsess') { state.host = id; state.view = 'term'; state.tab = 'all'; state.dlg = null; }
  else if (a === 'rebootok') { state.dlg = null; toast('Đã gửi lệnh khởi động lại (mô phỏng)'); return; }
  else if (a === 'rmok') { const i = HOSTS.findIndex((h) => h.id === id); if (i >= 0) HOSTS.splice(i, 1); if (state.host === id) state.host = 'all'; state.dlg = null; }
  else if (a === 'renameok') { sess(state.tab).n = document.getElementById('rn').value || sess(state.tab).n; state.dlg = null; }
  else if (a === 'setpet') sess(state.tab).e = id;
  else if (a === 'moveok') { const s = sess(state.tab), h = document.getElementById('mvh'); if (h) s.h = h.value; state.dlg = null; toast('Đã chuyển phiên sang ' + hostName(s.h)); return; }
  else if (a === 'openfile') state.file = id;
  else if (a === 'sendok') { sess(state.tab).lines.push('<span class="g">●</span> Đã nhận file: <b>bao-cao-tuan.pdf</b> → /data/thanhlg/uploads/'); state.dlg = null; }
  else if (a === 'newpet') { saveNf(); state.newPet = id; }
  else if (a === 'setdir') { saveNf(); state.nf.dir = id; }
  else if (a === 'dirin') state.dirPath.push(id);
  else if (a === 'dircd') state.dirPath = state.dirPath.slice(0, Number(id));
  else if (a === 'dirok') { state.nf.dir = '/' + state.dirPath.join('/'); state.dlg = 'new'; }
  else if (a === 'cmddel') state.cmds.splice(Number(id), 1);
  else if (a === 'cmdadd') { const v = document.getElementById('ncm').value.trim(); if (v) state.cmds.push(v); }
  else if (a === 'toast') { toast(id); return; }
  else if (a === 'logout') state.login = true;
  else if (a === 'login') state.login = false;
  render();
});
/* thợ làm việc thật sự "chạy": thêm sự kiện mới vào pane mỗi vài giây */
setInterval(() => {
  if (document.hidden || state.login) return;
  S.filter((s) => s.crew).forEach((s) => {
    s.feed ||= JSON.parse(JSON.stringify(FEED[s.id] || {}));
    s.workers.filter((w) => w.st === 'run').forEach((w) => { (s.feed[w.n] ||= []).push(POOL[Math.floor(Math.random() * POOL.length)]); if (s.feed[w.n].length > 30) s.feed[w.n].shift(); w.pr = Math.min(99, w.pr + 2); });
  });
  if (state.view === 'term' && sess(state.tab) && sess(state.tab).crew && !state.dlg && document.activeElement.id !== 'tinput') render();
}, 2500);
addEventListener('resize', render);
/* mở thẳng một màn bằng hash (để chụp kiểm): #over #all #fes #tok #note #ops #set #new #alerts #login */
(function init() {
  S.forEach((s) => { if (s.crew) s.feed = JSON.parse(JSON.stringify(FEED[s.id] || {})); });
  const h = (location.hash || '').slice(1);
  if (h === 'dark') { state.theme = 'dark'; document.documentElement.dataset.theme = 'dark'; }
  if (['over', 'tok', 'note', 'ops'].includes(h)) state.view = h;
  if (h === 'all') { state.view = 'term'; state.tab = 'all'; }
  if (sess(h)) { state.view = 'term'; state.tab = h; state.det = true; }
  if (['set', 'new', 'alerts'].includes(h)) state.dlg = h;
  if (h === 'login') state.login = true;
  render();
})();
</script>
