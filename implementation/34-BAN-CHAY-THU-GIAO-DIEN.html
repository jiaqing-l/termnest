<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TERMNEST · Bản chạy thử giao diện mới</title>
<style>
:root{--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--run:#2f7cf6;--wait:#e08a00;--ok:#16a36b;--bad:#e0344f;--idle:#8a93a6}
/* theme tokens */
.th-pets,.th-clean,.th-studio{--bg:#f4f6fb;--panel:#fff;--panel2:#f7f9fc;--ink:#1a2130;--mute:#5d6680;--line:#e4e8f0;--soft:#eef2f8;--pri:#ff5c7a;--pri-ink:#fff;--term:#0f1520;--term-ink:#d2dbe9;--chip:#fff;--shadow:none;--radius:12px;--accent:#ff5c7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 -apple-system,"Segoe UI",Inter,Roboto,sans-serif;background:#e9edf4;color:#1a2130}
.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;width:16px;height:16px}
button{font:inherit;color:inherit}
/* demo bar */
.demo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 14px 0;padding:8px 14px;background:#fff;border:1px solid #e4e8f0;border-radius:14px;color:#1a2130;font-size:13px}
.demo b{font-weight:800}.demo .sp{flex:1}
.dsw{display:inline-flex;background:#fff;border:1px solid #e4e8f0;border-radius:999px;padding:3px}.dsw button{border:0;background:none;color:#5d6680;border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:12.5px}.dsw button.on{background:#1a2130;color:#fff}
.hint{color:#5d6680}
.stagewrap{display:flex;justify-content:center;padding:14px}
#app{font-size:13.5px;width:100%;max-width:1480px;height:calc(100vh - 92px);min-height:640px;background:var(--bg);color:var(--ink);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:56px 1fr;box-shadow:0 20px 50px -25px rgba(20,30,60,.5);position:relative}
#app.phone{width:390px;height:820px;border-radius:34px;border:9px solid #1a2130;grid-template-rows:52px 1fr 60px}
/* top bar */
.tb{display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{height:36px;width:124px;flex:none;cursor:pointer}.mark{height:32px;width:32px;flex:none}
.logo-dark{display:none}
.search{display:flex;align-items:center;gap:8px;width:330px;height:34px;border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--mute);background:var(--soft);cursor:pointer;flex:none}.search kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--panel)}
.sp{flex:1}
.q{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;background:var(--chip);white-space:nowrap;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ib{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;background:var(--chip);cursor:pointer;flex:none}.ib .n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#ff5c7a;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.pbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:10px;background:var(--pri);color:var(--pri-ink);font-weight:700;cursor:pointer;white-space:nowrap}

/* layout */
.body{display:grid;grid-template-columns:244px 1fr;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
.sh{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin:12px 8px 4px;display:flex;align-items:center}
.si{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;cursor:pointer}.si:hover{background:var(--soft)}.si.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--pri)}
.si>div{min-width:0;flex:1}.si b{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.si small{display:block;color:var(--mute);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{font-size:11px;font-weight:700;color:var(--mute);background:var(--soft);border-radius:999px;padding:1px 7px;margin-left:auto}.cnt.w{background:rgba(224,138,0,.15);color:var(--wait)}
.av{position:relative;display:inline-block;flex:none}.av svg{width:100%;height:100%;display:block}.av>i{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--panel)}
.nopets .av{width:auto!important;height:auto!important}.nopets .av svg{display:none}.nopets .av>i{position:static;border:0;width:9px;height:9px;display:inline-block}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;gap:10px;padding:12px 18px 0}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}.seg button{border:0;background:none;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}.seg button.on{background:var(--ink);color:var(--panel)}.dark .seg button.on{background:var(--soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

.view{flex:1;min-height:0;overflow:auto;padding:14px 18px 18px;display:none}.view.on{display:block}
.tgl{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-weight:600;cursor:pointer;user-select:none}.tgl i{width:32px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:.2s}.tgl i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}.tgl.on i{background:var(--ok)}.tgl.on i:after{left:16px}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.alert{display:flex;align-items:center;gap:14px;padding:12px 16px;border-left:5px solid var(--wait);margin-bottom:12px}.alert b{font-size:15px}.alert small{color:var(--mute)}
.alert.ok{border-left-color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-weight:650;font-size:13px;cursor:pointer;white-space:nowrap}.btn.p{background:var(--pri);border-color:transparent;color:var(--pri-ink)}.btn.sm{height:28px;padding:0 10px;font-size:12.5px}.btn.danger{color:var(--bad)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.mc{padding:12px 14px;display:grid;gap:8px}.mc .h{display:flex;align-items:center;gap:8px}.mc .h small{color:var(--mute)}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mt{display:grid;gap:3px;font-size:12px;color:var(--mute)}.mt b{color:var(--ink);font-size:13px}.track{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.track i{display:block;height:100%;border-radius:3px;transition:width .6s}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}.p-run{background:rgba(47,124,246,.13);color:var(--run)}.p-wait{background:rgba(224,138,0,.15);color:var(--wait)}.p-done{background:rgba(22,163,107,.14);color:var(--ok)}.p-idle{background:var(--soft);color:var(--mute)}.p-hot{background:rgba(224,52,79,.12);color:var(--bad)}
.yard{margin-bottom:12px;overflow:hidden}.yard .yh{display:flex;align-items:center;gap:8px;padding:8px 12px}.yard .yh small{color:var(--mute)}
.grass{position:relative;height:82px;background:linear-gradient(#bfe3ff,#e6f6ff 55%,#a8dd8c 56%,#8fcf74)}
.yp{position:absolute;bottom:6px;width:46px;height:46px;cursor:pointer;transition:left 1.2s ease}.yp svg{width:100%;height:100%}.yp em{position:absolute;top:-6px;right:-4px;background:var(--wait);color:#fff;font-style:normal;font-weight:800;font-size:11px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center}
.yp.squish svg{animation:sq .6s}@keyframes sq{20%{transform:scale(1.25,.5) translateY(10px)}60%{transform:scale(.9,1.1)}}
.yp.hop svg{animation:hop .5s}@keyframes hop{50%{transform:translateY(-14px)}}
.ball{position:absolute;bottom:8px;left:50%;font-size:18px;transition:left .8s ease,bottom .4s}
.say{position:absolute;bottom:56px;background:#fff;color:#1a2130;border-radius:10px;padding:3px 8px;font-size:12px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4);white-space:nowrap;pointer-events:none}
.yard.hammer,.yard.hammer .yp{cursor:crosshair}
.nopets .yard,.nopets .petonly{display:none!important}
.shead{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sc{overflow:hidden;display:grid;grid-template-rows:auto 92px auto;cursor:pointer;transition:transform .15s}.sc:hover{transform:translateY(-2px)}
.sc.wait{border-color:#f0c271;box-shadow:0 0 0 3px rgba(224,138,0,.14)}
.sc .h{display:flex;align-items:center;gap:8px;padding:9px 12px;min-width:0}.sc .h b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.sc .h small{margin-left:auto;color:var(--mute);font-size:11.5px;white-space:nowrap}
.pv{background:var(--term);color:var(--term-ink);font:11.5px/1.5 var(--mono);padding:8px 12px;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.sc .f{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:11.5px;color:var(--mute);min-height:46px}
.in{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:8px;padding:0 9px;background:var(--soft);color:var(--ink);font:inherit;font-size:12.5px}
/* terminal */
.tvw{display:grid;grid-template-columns:1fr 286px;gap:14px;height:100%}
.tabs{display:flex;gap:4px;overflow-x:auto}.tab{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px 9px 0 0;font-weight:650;color:var(--mute);cursor:pointer;white-space:nowrap}.tab.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 -2px 0 var(--pri)}
.tw{background:var(--term);border-radius:0 12px 12px 12px;display:grid;grid-template-rows:1fr auto auto;overflow:hidden;min-height:420px;height:calc(100% - 38px)}
.tt{color:var(--term-ink);font:var(--tfs,12.5px)/1.6 var(--mono);padding:14px 16px;white-space:pre-wrap;overflow:auto}.tt .g{color:#7fdbca}.tt .y{color:#ffcb6b}.tt .p{color:#c792ea}.tt .d{color:#6b7489}.tt .u{color:#82aaff}
.tbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.07);position:relative;flex-wrap:nowrap;overflow-x:auto}
.k{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.08);color:#d6deeb;font-weight:600;font-size:12.5px;border:0;cursor:pointer;white-space:nowrap}.k:hover{background:rgba(255,255,255,.14)}
.reply{display:flex;align-items:center;gap:8px;padding:8px 10px}.reply input{flex:1;height:36px;border-radius:9px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);color:#e8ecf3;padding:0 12px;font:13px inherit;outline:none}.reply input:focus{border-color:var(--pri)}
.menu{position:absolute;z-index:45!important;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px -18px rgba(0,0,0,.5);padding:6px;display:grid;min-width:180px;z-index:5}.menu button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;font-weight:600}.menu button:hover{background:var(--soft)}
.dp{padding:14px;display:grid;gap:12px;align-content:start}.dp .who{display:flex;align-items:center;gap:10px}.dp .who b{font-size:15px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:5px 8px;font-size:12.5px;margin:0}.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-all}
.bub{position:absolute;right:320px;top:118px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;box-shadow:0 8px 20px -10px rgba(0,0,0,.3);animation:fadeout 6s forwards;pointer-events:none}@keyframes fadeout{80%{opacity:1}100%{opacity:0}}
/* token */
.ac{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:12px}.acc{padding:14px;display:grid;gap:12px;align-content:start}.acc .h{display:flex;align-items:center;gap:8px}.acc .h small{display:block;color:var(--mute);font-size:12px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ring{display:flex;align-items:center;gap:10px}.rg{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);position:relative;flex:none}.rg:before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel)}.rg span{position:relative}.ring small{display:block;color:var(--mute);font-size:11.5px}
.skel{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--panel2),var(--soft));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:12px}.kpi{padding:12px 14px}.kpi small{color:var(--mute);font-weight:600}.kpi b{display:block;font-size:22px}
.chart{padding:14px}.chart svg text{fill:var(--mute)}
/* notes */
.notes{display:grid;grid-template-columns:260px 1fr;gap:12px;height:100%}.notes textarea{width:100%;height:calc(100% - 60px);min-height:300px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:12px;font:13px/1.6 var(--mono);resize:none}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(10,14,25,.45);display:none;align-items:flex-start;justify-content:center;padding-top:70px;z-index:30}.ov.on{display:flex}
.dlg{width:min(760px,94%);max-height:calc(100% - 100px);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.dlg .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}.dlg .dh h2{margin:0;font-size:17px;flex:1}
.dlg .db{overflow:auto;padding:16px 18px}
.setgrid{display:grid;grid-template-columns:170px 1fr;min-height:0}.setnav{border-right:1px solid var(--line);padding:10px;display:grid;gap:2px;align-content:start}.setnav button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:9px;font-weight:600;color:var(--mute);cursor:pointer}.setnav button.on{background:var(--pri);color:var(--pri-ink)}
.thcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.thc{border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:var(--panel2)}.thc.on{border-color:var(--pri);box-shadow:0 0 0 3px rgba(255,92,122,.18)}
.thc .pvw{height:84px;border-radius:8px;overflow:hidden;display:grid;grid-template-columns:28% 1fr;margin-bottom:8px}.thc b{display:block}.thc small{color:var(--mute);font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row span{flex:1}
.pal{width:min(620px,94%);overflow:hidden}.pal input{width:100%;height:48px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:0 16px;font-size:15px;outline:none}
.pal .items{max-height:360px;overflow:auto;padding:6px}.pit{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer}.pit.sel,.pit:hover{background:var(--soft)}.pit small{margin-left:auto;color:var(--mute)}
.drop{position:absolute;top:52px;right:150px;width:340px;z-index:25;display:none;padding:6px}.drop.on{display:block}.drop .it{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:9px;cursor:pointer}.drop .it:hover{background:var(--soft)}.drop .it small{display:block;color:var(--mute)}
.toasts{position:absolute;right:16px;bottom:16px;display:grid;gap:8px;z-index:40}.toast{display:flex;align-items:center;gap:10px;padding:10px 14px;min-width:280px;animation:tin .3s}.toast small{display:block;color:var(--mute)}@keyframes tin{from{transform:translateY(10px);opacity:0}}
.form{display:grid;gap:10px}.form label{display:grid;gap:4px;font-weight:600;font-size:13px}.form input,.form select{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);padding:0 10px;font:inherit}
.bnav{display:none}
/* phone layout */
#app.phone .body{grid-template-columns:1fr}#app.phone .side{display:none}#app.phone .search,#app.phone .q.full,#app.phone .pbtn span,#app.phone .vbar .seg{display:none}
#app.phone .logo{display:none!important}#app.phone .mark{display:block}#app.phone .tb{padding:0 10px;gap:6px}#app.phone .q{height:26px;padding:0 8px}
#app.phone .bnav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line)}.bnav button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding-top:8px;font-size:11px;font-weight:650;color:var(--mute);cursor:pointer}.bnav button.on{color:var(--pri)}
#app.phone .tvw{grid-template-columns:minmax(0,1fr)}#app.phone .tvw>*,#app.phone .tw,#app.phone .main{min-width:0}#app.phone .tbar{flex-wrap:wrap;overflow:visible}#app.phone .dp{display:none}#app.phone .view{padding:10px}#app.phone .vbar{padding:10px 10px 0}
#app.phone .grid3,#app.phone .sgrid{grid-template-columns:1fr}#app.phone .notes{grid-template-columns:1fr}#app.phone .notes .card:first-child{display:none}
#app.phone .bub{right:14px}#app.phone .drop{right:8px;width:calc(100% - 16px)}#app.phone .setgrid{grid-template-columns:1fr}#app.phone .setnav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}#app.phone .thcards{grid-template-columns:1fr}
.mark{display:none}

[hidden]{display:none!important}
/* dark / light for every theme (the app keeps its sun/moon switch) */
.dark{--bg:#0f131b;--panel:#171c27;--panel2:#1c2230;--ink:#e8ecf3;--mute:#9aa3b6;--line:#283043;--soft:#1f2635;--chip:#171c27;--term:#0a0e15;--shadow:none}
.dark .grass{background:linear-gradient(#141a33,#1b2142 55%,#1f3a2c 56%,#183224)}
.dark .av>i{border-color:var(--panel)}
.dark .say{background:#232a3a;color:#fff}
.mc .h{flex-wrap:wrap}.mc .h b{white-space:nowrap}
.grid3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
#app.phone .toasts{top:60px;bottom:auto;left:10px;right:10px}#app.phone .toast{min-width:0}
#app.phone .grid3 .mc .bars{display:none}#app.phone .grid3{gap:6px}#app.phone .mc{padding:9px 12px}
#app.phone .alert{flex-wrap:wrap}#app.phone .alert .btn.p{width:100%;justify-content:center}


/* Gọn */
.si.c{padding:4px 8px;gap:8px}.si.c b{font-weight:550;font-size:12.5px}
.th-clean .vbar .tgl{display:none}
.cbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-left:3px solid var(--wait);border-radius:6px;background:var(--panel);margin-bottom:10px;font-size:13px}.cbar span{color:var(--mute)}
.mstrip{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.ms{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--panel);font-size:12.5px}.ms span{color:var(--mute);font-variant-numeric:tabular-nums}.ms .bad{color:var(--bad);font-weight:700}.ms em{font-style:normal;color:var(--bad);font-weight:700}
.tblc{overflow:auto;border-radius:6px}.ttab{width:100%;border-collapse:collapse;font-size:13px}.ttab th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line)}
.ttab td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}.ttab tr[data-open]{cursor:pointer}.ttab tr[data-open]:hover td{background:var(--soft)}.ttab td small{color:var(--mute)}.ttab .mono{font:12px var(--mono);color:var(--mute)}
.ttab .grp td{background:var(--panel2);font-weight:700;font-size:12px;color:var(--mute);padding:5px 10px}.qrow{display:flex;gap:6px;align-items:center}.qrow .in{height:28px}
.tclean{display:grid;grid-template-columns:220px 1fr;gap:10px;height:100%}.tlist{padding:6px;overflow:auto;border-radius:6px}.tl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12.5px}.tl b{font-weight:550;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tl small{color:var(--mute)}.tl.on,.tl:hover{background:var(--soft)}
.tw2{display:flex;flex-direction:column;min-height:0;height:100%}.thead{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;font-size:13px}.thead span{color:var(--mute)}

/* Studio */
.th-studio .body{grid-template-columns:64px 1fr}.th-studio .side{padding:10px 8px}
.rail{display:grid;gap:6px;justify-items:center}.rb,.ra{width:42px;height:42px;border:0;border-radius:12px;background:none;color:var(--mute);display:grid;place-items:center;cursor:pointer;position:relative}.rb:hover,.ra:hover{background:var(--soft)}.rb.on{background:var(--soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--pri)}.ra.on{box-shadow:0 0 0 2px var(--pri)}.rb .ic{width:19px;height:19px}.rsep{width:28px;height:1px;background:var(--line);margin:4px 0}
.th-studio .vbar .seg{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:12px}.tile{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}.tile small{display:block;color:var(--mute);font-size:12px;white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;align-items:start}.col{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;min-height:200px}.col .ch{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}.col .ch .cnt{margin-left:auto}
.kc{padding:10px;display:grid;gap:8px;cursor:pointer}.kc:hover{box-shadow:0 0 0 1px var(--pri)}.kh{display:flex;align-items:center;gap:8px;min-width:0}.kh b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kh small{margin-left:auto;color:var(--mute);font-size:11px;white-space:nowrap}.km{font:12px/1.45 var(--mono);color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.kt{color:var(--mute);font-size:11.5px}
.kc.add{border:1px dashed var(--line);border-radius:12px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;background:none}
.tstudio{display:grid;grid-template-columns:1fr 280px;gap:12px;height:100%}.tstudio .tw{border-radius:14px;grid-template-rows:auto 1fr auto auto}.thead.dark{background:rgba(255,255,255,.04);border:0;border-bottom:1px solid rgba(255,255,255,.07);border-radius:0;color:#e8ebf4}.thead.dark span{color:#8d95ab}
.mini{display:grid;gap:8px;align-content:start;overflow:auto}.mn{overflow:hidden;cursor:pointer}.mn .kh{padding:7px 10px}.mn.wait{border-color:#f0c271;box-shadow:0 0 0 3px rgba(224,138,0,.14)}.mn:hover{box-shadow:0 0 0 1px var(--pri)}
#app.phone .board{grid-template-columns:1fr}#app.phone .tstudio,#app.phone .tclean{grid-template-columns:1fr}#app.phone .mini,#app.phone .tlist{display:none}#app.phone.th-studio .side{display:none}#app.phone .ttab th:nth-child(2),#app.phone .ttab td:nth-child(2),#app.phone .ttab th:nth-child(4),#app.phone .ttab td:nth-child(4),#app.phone .ttab th:nth-child(5),#app.phone .ttab td:nth-child(5){display:none}#app.phone .hero .scene{display:none}#app.phone .mstrip .ms span:nth-of-type(3){display:none}
/* terminal full screen */
#app.fsmode,#app.phone.fsmode{grid-template-rows:minmax(0,1fr)}#app.fsmode>.tb,#app.fsmode .side,#app.fsmode .vbar,#app.fsmode .dp,#app.fsmode .mini,#app.fsmode .tlist,#app.fsmode .tabs,#app.fsmode .bnav,#app.fsmode .bub{display:none!important}#app.fsmode .body{grid-template-columns:minmax(0,1fr)!important}#app.fsmode .tvw,#app.fsmode .tstudio,#app.fsmode .tclean{grid-template-columns:minmax(0,1fr)!important}#app.fsmode .view{padding:8px}#app.fsmode .tw{height:100%!important;border-radius:12px}#app.phone .tbar [data-act="help"]{display:none}#app.fsmode .main{height:100%}
/* terminal: xem tất cả */
.tall{display:flex;flex-direction:column;height:100%;min-height:0}.tgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));grid-auto-rows:260px;gap:10px;padding-top:10px}
.tcell{background:var(--term);border-radius:12px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;border:1px solid transparent}.tcell.wait{border-color:#f0c271;box-shadow:0 0 0 3px rgba(224,138,0,.14)}
.tch{display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(255,255,255,.05);color:#e8ecf3;cursor:pointer;min-width:0}.tch b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tch small{margin-left:auto;color:#8d95ab;font-size:11.5px;white-space:nowrap}.tch .ic{color:#8d95ab;width:14px;height:14px}.tch:hover .ic{color:#fff}
.tcell .tt{font-size:11.5px;padding:8px 10px;overflow:auto}.tcf{display:flex;gap:6px;padding:6px 8px;border-top:1px solid rgba(255,255,255,.07)}.tcf .in{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.12);color:#e8ecf3}
#app.phone .tgrid{grid-template-columns:1fr}
/* co giãn: không tràn ngang ở cửa sổ hẹp */
#app{grid-template-columns:minmax(0,1fr)}.tb{min-width:0;overflow:hidden}#quotas{min-width:0;overflow:hidden}.view{overflow-x:hidden}
.shead{flex-wrap:wrap}.sgrid{grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr))}.grid3{grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}.ac{grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr))}.tgrid{grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr))}
@media (max-width:1380px){#quotas .q:nth-child(n+3){display:none}}
@media (max-width:1180px){#quotas .q:nth-child(n+2){display:none}.search{width:220px}}
@media (max-width:980px){#app:not(.phone) .search{width:40px}#app:not(.phone) .search span,#app:not(.phone) .search kbd{display:none}#app:not(.phone) .body{grid-template-columns:200px minmax(0,1fr)}#app:not(.phone) .tvw{grid-template-columns:minmax(0,1fr)}#app:not(.phone) .tvw .dp{display:none}}
#app.phone .shead .seg:first-of-type{overflow-x:auto;max-width:100%}#app.phone .shead{gap:6px}

/* settings */

 var pane={look:'<b>Theme</b><p style="color:var(--mute);margin:4px 0 10px">Ba theme dùng chung bố cục, đổi ngay khi bấm.</p><div class="thcards">'+[['pets','🐾 Thú cưng','Thẻ phiên có thú cưng, sân chơi','#f4f6fb','#ff5c7a'],['clean','▫ Gọn','Bố cục thẻ như Thú cưng, không thú cưng và sân chơi','#f4f6fb','#ff5c7a'],['studio','✦ Studio','Thanh biểu tượng, phiên theo cột Kanban','#f4f6fb','#ff5c7a']].map(function(t){return '<div class="thc'+(S.theme===t[0]?' on':'')+'" data-theme="'+t[0]+'"><div class="pvw" style="background:'+t[3]+'"><div style="background:'+'#fff'+';border-right:1px solid rgba(128,128,128,.2)"></div><div style="padding:8px;display:grid;gap:5px;align-content:start"><i style="display:block;height:8px;width:60%;border-radius:4px;background:'+t[4]+'"></i><i style="display:block;height:26px;border-radius:5px;background:'+'#eef2f8'+'"></i><i style="display:block;height:18px;border-radius:5px;background:#0f1520"></i></div></div><b>'+t[1]+'</b><small>'+t[2]+'</small></div>';}).join('')+'</div>'
   +'<div class="row"><span>Sáng / tối</span><div class="seg" id="setMode"><button data-sm="light" class="'+(isDark()?'':'on')+'">☀ Sáng</button><button data-sm="dark" class="'+(isDark()?'on':'')+'">🌙 Tối</button></div></div>'+'<div class="row"><span>Hiện thú cưng (thanh bên, thẻ phiên, sân chơi)</span><span class="tgl'+(S.pets?' on':'')+'" id="setPets"><i></i></span></div><div class="row"><span>Ngôn ngữ</span><select class="in" style="flex:none;width:140px"><option>Tiếng Việt</option><option>English</option></select></div>',
  alert:'<div class="row"><span>Phiên hỏi bạn: thông báo sau 5 giây</span><span class="tgl on"><i></i></span></div><div class="row"><span>Phiên xong: thông báo sau 30 giây</span><span class="tgl on"><i></i></span></div><div class="row"><span>Tiếng meo</span><span class="tgl on"><i></i></span></div><div class="row"><span>Nhắc lại mỗi 10 phút nếu chưa xem</span><span class="tgl"><i></i></span></div>',
  srv:S.servers.map(function(v){return '<div class="row"><i class="dot" style="background:var(--ok)"></i><span><b>'+v.name+'</b><br><small style="color:var(--mute)">'+v.os+' · 🔑 SSH key</small></span><button class="btn sm">Chi tiết</button></div>';}).join('')+'<div class="row"><span>Thêm máy chủ chỉ bằng SSH key</span><span class="tgl on"><i></i></span></div>',
  bk:'<div class="row"><span>Tự động sao lưu</span><select class="in" style="flex:none;width:120px"><option>1 giờ</option></select></div><div class="row"><span>Lần gần nhất <small style="color:var(--mute)">11:46 · 07/11</small></span><button class="btn sm">Sao lưu ngay</button></div><div class="row"><span>Chuyển sang máy mới</span><button class="btn sm p">Xuất…</button></div>'};
 o.innerHTML='<div class="card dlg"><div class="dh"><h2>Cài đặt</h2><button class="btn" id="dlgClose">Đóng</button></div><div class="setgrid"><div class="setnav">'+tabs.map(function(t){return '<button class="'+(S.setTab===t[0]?'on':'')+'" data-stab="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div><div class="db">'+pane[S.setTab]+'</div></div></div>';o.classList.add('on');
 o.querySelectorAll('[data-stab]').forEach(function(b){b.onclick=function(){S.setTab=b.dataset.stab;settings();};});
 o.querySelectorAll('[data-theme]').forEach(function(b){b.onclick=function(){setTheme(b.dataset.theme);render();settings();};});
 o.querySelectorAll('[data-sm]').forEach(function(b){b.onclick=function(){S.dark=b.dataset.sm==='dark';render();settings();};});
 var sp=$('setPets');if(sp)sp.onclick=function(){S.pets=!S.pets;render();settings();};
 o.querySelectorAll('.tgl:not(#setPets)').forEach(function(t){t.onclick=function(){t.classList.toggle('on');};});
 $('dlgClose').onclick=closeAll;}
function newDlg(){var o=$('ov');o.innerHTML='<div class="card dlg" style="width:min(460px,94%)"><div class="dh"><h2>Phiên mới</h2><button class="btn" id="dlgClose">Đóng</button></div><div class="db"><div class="form"><label>Tên phiên<input id="nName" value="Report-Fix"></label><label>Máy chủ<select id="nSrv">'+S.servers.map(function(v){return '<option value="'+v.id+'">'+v.name+'</option>';}).join('')+'</select></label><label>Chạy<select id="nTool"><option>Claude</option><option>Codex</option><option>Shell</option></select></label><button class="btn p" id="nGo" style="justify-self:end">Tạo phiên</button></div></div></div>';o.classList.add('on');
 $('dlgClose').onclick=closeAll;$('nGo').onclick=function(){var pets=['cat','fox','bunny','owl','penguin','frog'],id=Date.now();var s={id:id,name:$('nName').value.replace(/[^A-Za-z0-9_-]/g,'')||'Moi',srv:$('nSrv').value,pet:pets[id%6],tool:$('nTool').value,st:'run',lines:['<span class="d">'+srv($('nSrv').value).name+' / phiên mới · '+$('nTool').value+'</span>','<span class="p">●</span> Sẵn sàng.'],act:'vừa xong'};S.sessions.unshift(s);openS(id);toast('🐣','Đã tạo '+s.name,srv(s.srv).name);};}
function bellDrop(){var d=$('drop');if(d.classList.contains('on')){d.classList.remove('on');return;}S.read=S.alerts.length;d.innerHTML='<div style="display:flex;align-items:center;padding:6px 10px"><b>Thông báo</b><span class="sp"></span><small style="color:var(--mute)">'+S.alerts.length+'</small></div>'+(S.alerts.map(function(a){var s=sess(a.sid);return s?'<div class="it" data-open="'+s.id+'">'+av(s,26)+'<div><b>'+esc(s.name)+(a.kind==='ask'?' đang hỏi bạn':' đã xong')+'</b><small>'+srv(s.srv).name+' · '+a.at+'</small></div></div>':'';}).join('')||'<div class="it"><div><b>Chưa có thông báo</b><small>Thử trả lời một phiên để xem thông báo hiện ra.</small></div></div>');d.classList.add('on');renderTop();}
/* events */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-tall],[data-go],[data-open],[data-filter],[data-layout],[data-send],[data-menu],[data-key],[data-act],[data-pet],#kick,#hammer,#newCard,#tokRefresh,#replyBtn');
 if(e.target.closest('.menu button')){var mb=e.target.closest('.menu button');var s=sess(S.cur);if(s){s.lines.push('<span class="d">'+esc(mb.textContent)+'</span>');render();}closeAll();return;}
 if(!e.target.closest('#drop')&&!e.target.closest('#bell'))$('drop').classList.remove('on');
 if(e.target===$('ov'))closeAll();
 if(!t)return;
 if(t.dataset.send){e.stopPropagation();var inp=document.querySelector('[data-quick="'+t.dataset.send+'"]');send(+t.dataset.send,inp?inp.value||'Tiếp tục nhé':'Tiếp tục nhé');return;}
 if(e.target.closest('input'))return;
 if(t.dataset.pet!==undefined){var s=sess(+t.dataset.pet);if(S.hammer){t.classList.remove('squish');void t.offsetWidth;t.classList.add('squish');say(t,['Á đau!','Sếp ơi tha em!','Ui da!','Gõ nhẹ thôi sếp!'][Math.floor(Math.random()*4)]);}else{t.classList.remove('hop');void t.offsetWidth;t.classList.add('hop');say(t,s.name+': '+ST[s.st][0].toLowerCase());}return;}
 if(t.id==='kick'){kick();return;}if(t.id==='hammer'){S.hammer=!S.hammer;render();return;}if(t.id==='newCard'){newDlg();return;}
 if(t.id==='tokRefresh'){S.tokenLoading=true;render();setTimeout(function(){S.tokenLoading=false;render();},1500);return;}
 if(t.id==='replyBtn'){var i=$('replyIn');send(S.cur,i.value);return;}
 if(t.dataset.tall){S.tall=true;render();return;}
 if(t.dataset.go){S.view=t.dataset.go;render();return;}
 if(t.dataset.open){openS(+t.dataset.open);return;}
 if(t.dataset.filter){S.filter=t.dataset.filter;render();return;}
 if(t.dataset.layout){S.layout=t.dataset.layout;render();return;}
 if(t.dataset.key){var s=sess(S.cur);s.lines.push('<span class="d">^'+t.dataset.key+'</span>');render();return;}
 if(t.dataset.menu){document.querySelectorAll('.menu').forEach(function(m){m.remove();});var m=document.createElement('div');m.className='menu';var ar=$('app').getBoundingClientRect(),br=t.getBoundingClientRect();m.style.left=Math.max(8,Math.min(br.left-ar.left,ar.width-196))+'px';m.style.bottom=(ar.bottom-br.top+6)+'px';m.innerHTML=(t.dataset.menu==='keys'?['Tab','↑','↓','Ctrl+B','Dòng mới','Ctrl+D']:['git status','git pull','npm test','/compact','/clear']).map(function(x){return '<button>'+x+'</button>';}).join('');$('app').append(m);e.stopPropagation();return;}
 if(t.dataset.act){var a=t.dataset.act;if(a==='fup'||a==='fdown'){S.fsize=Math.max(10,Math.min(20,(S.fsize||12.5)+(a==='fup'?1:-1)));render();return;}if(a==='fs'){S.fs=!S.fs;render();return;}if(a==='stop'){var s=sess(S.cur);s.st='idle';s.lines.push('<span class="d">[phiên đã dừng]</span>');toast('⏹','Đã dừng '+s.name,'');render();}else toast(a==='move'?'⇄':a==='help'?'❔':'📎',{move:'Chuyển sang máy khác',file:'Gửi file',open:'Mở file',help:'Trợ giúp'}[a],'Trong bản thật sẽ mở hộp tương ứng');return;}
});
document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette();}if(e.key==='Escape'){if(S.fs&&!$('ov').classList.contains('on')){S.fs=false;render();}closeAll();}if(e.key==='Enter'&&e.target.id==='replyIn'){send(S.cur,e.target.value);}if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.quick){send(+e.target.dataset.quick,e.target.value);}});
$('openPal').onclick=palette;$('gear').onclick=settings;$('newBtn').onclick=newDlg;$('bell').onclick=function(e){e.stopPropagation();bellDrop();};
$('petTgl').onclick=function(){S.pets=!S.pets;render();};
function isDark(){return !!S.dark;}
$('modeBtn').onclick=function(){S.dark=!isDark();render();};
document.querySelectorAll('#dMode button').forEach(function(b){b.onclick=function(){S.dark=b.dataset.m==='dark';render();};});
document.querySelectorAll('#dTheme button').forEach(function(b){b.onclick=function(){setTheme(b.dataset.t);render();};});
function setTheme(t){S.theme=t;}
document.querySelectorAll('#dDev button').forEach(function(b){b.onclick=function(){S.phone=b.dataset.d==='phone';render();};});
$('dReset').onclick=function(){var th=S.theme,ph=S.phone;S=SEED();S.theme=th;S.phone=ph;closeAll();render();};
function say(el,text){var g=$('grass');if(!g)return;var b=document.createElement('span');b.className='say';b.textContent=text;b.style.left=el.style.left;g.append(b);setTimeout(function(){b.remove();},1600);}
function kick(){var b=$('ballel');if(!b)return;b.hidden=false;var pets=[].slice.call(document.querySelectorAll('.yp'));var n=0;var iv=setInterval(function(){var x=10+Math.random()*80;b.style.left=x+'%';b.style.bottom=(8+Math.random()*30)+'px';var p=pets[n%pets.length];if(p){p.style.left=Math.max(0,x-5)+'%';}n++;if(n>8){clearInterval(iv);b.hidden=true;say(pets[0]||b,'Vàooo! ⚽');}},700);}
/* life: running sessions print lines; one asks a question now and then */
var tick=0;setInterval(function(){tick++;var run=S.sessions.filter(function(s){return s.st==='run';});if(!run.length)return;var s=run[tick%run.length];
 s.lines.push(['<span class="p">●</span> Đọc thêm 2 tệp','<span class="p">●</span> Chạy test… '+(30+tick%12)+'/42','<span class="p">●</span> Cập nhật tài liệu','<span class="g">✓</span> Build xanh'][tick%4]);s.act='vừa xong';
 S.servers[1].cpu=55+Math.round(Math.random()*30);S.servers[0].cpu=20+Math.round(Math.random()*25);
 if(tick%5===0){s.st='wait';s.q='Có ghi đè tệp ImageService.cs không? (y/n)';s.lines.push('','<span class="y">  Có ghi đè tệp ImageService.cs không? (y/n)</span>');alertFor(s,'ask');}
 if(S.view==='over'||S.view==='term'&&S.cur===s.id||true){var act=document.activeElement&&document.activeElement.tagName==='INPUT'&&document.activeElement.value;if(!act)render();else{renderSide();renderTop();}}
},4000);
render();
setTimeout(function(){toast('👋','Chào bạn!','Bấm vào một phiên, gõ trả lời, hoặc thử ⌘K, chuông, ⚙ Cài đặt.');},600);
</script>
