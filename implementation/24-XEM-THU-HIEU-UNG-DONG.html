<style>*{box-sizing:border-box}body{margin:0;background:#101828;color:#e8eefb;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 18px}header h1{margin:0 0 4px;font-size:19px}header p{margin:0;color:#aab6d0;font-size:13.5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 18px 12px}.bar button{border:1.5px solid #3a475f;background:#1b2740;color:#dbe4f5;border-radius:99px;padding:7px 14px;font:600 13px system-ui;cursor:pointer}.bar button[aria-pressed=true]{background:#ff5d7a;border-color:#ff5d7a;color:#fff}

/* ---------- Effects (Settings → Hiệu ứng): light particles over the usual look ---------- */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
#app.in-focus~#fx,#fx:empty{display:none}
#fx i{position:absolute;top:0;left:var(--x);width:var(--s);height:var(--s);background:var(--img) center/contain no-repeat;opacity:var(--o);will-change:transform;animation:fx-fall var(--d) linear var(--dl) infinite}
#fx.rise i{top:auto;bottom:0;animation-name:fx-rise}
#fx.twinkle i{top:var(--y);animation:fx-twinkle var(--d) ease-in-out var(--dl) infinite}
#fx.paused i{animation-play-state:paused}
@keyframes fx-fall{0%{transform:translate3d(0,-8vh,0) rotate(0)}100%{transform:translate3d(var(--dx),108vh,0) rotate(var(--rot))}}
@keyframes fx-rise{0%{transform:translate3d(0,8vh,0) scale(.6)}100%{transform:translate3d(var(--dx),-108vh,0) scale(1.1)}}
@keyframes fx-twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:var(--o);transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){#fx{display:none}}

@keyframes fx-rain{0%{transform:translate3d(-4vh,-10vh,0)}100%{transform:translate3d(26vh,108vh,0)}}
#fx.drift i{top:var(--y);animation:fx-drift var(--d) ease-in-out var(--dl) infinite alternate}
#fx.drift i::before{content:"";position:absolute;inset:0;background:var(--img) center/contain no-repeat;animation:fx-flap .5s ease-in-out infinite alternate}

@keyframes fx-flap{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
#fx.burst i{top:var(--y);width:0;height:0;background:none;animation:none}
#fx.burst b{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c);opacity:0;animation:fx-spark var(--d) cubic-bezier(.1,.7,.3,1) var(--dl) infinite}

    anhdao: { img: ['petal'], n: 22, mode: 'fall', d: 12 }, mai: { img: ['mai'], n: 18, mode: 'fall', d: 14 }, thu: { img: ['leaf'], n: 18, mode: 'fall', d: 13 },
    dong: { img: ['snow'], n: 34, mode: 'fall', d: 9 }, he: { img: ['bubble'], n: 14, mode: 'rise', d: 14 }, dem: { img: ['star'], n: 38, mode: 'twinkle', d: 3 },
    mua: { img: [], n: 90, mode: 'rain', d: 0.9 }, noel: { img: ['snow', 'snow', 'ball', 'gift'], n: 30, mode: 'fall', d: 10 },
    trungthu: { img: ['lantern'], n: 12, mode: 'rise', d: 17, size: [22, 38] }, halloween: { img: ['pumpkin', 'bat'], n: 16, mode: 'fall', d: 12 },
    buom: { img: ['butterfly'], n: 9, mode: 'drift', d: 16, size: [20, 30] }, phaohoa: { img: [], n: 5, mode: 'burst', d: 2.6 }
  };
  var COLORS = ['#ff3d6e', '#ffb300', '#1fb6ff', '#2ecc71', '#b05cff', '#ff7a1a'];
  function r(a, b) { return a + Math.random() * (b - a); }
  function render(layer, kind, amount, narrow) {
    layer.textContent = ''; layer.className = ''; var cfg = KINDS[kind]; if (!cfg) return 0;
    var n = Math.max(3, Math.round(cfg.n * (amount || 1) * (narrow ? 0.5 : 1))); layer.className = cfg.mode; layer.setAttribute('data-k', kind);
    for (var k = 0; k < n; k++) {
      var p = document.createElement('i'), sz = cfg.size ? r(cfg.size[0], cfg.size[1]) : cfg.mode === 'rain' ? r(14, 30) : cfg.mode === 'twinkle' ? r(6, 18) : r(12, 26);
      var img = cfg.img.length ? cfg.img[Math.floor(Math.random() * cfg.img.length)] : '';
      p.style.cssText = (img ? '--img:var(--img-' + img + ');' : '') + '--x:' + r(0, 100).toFixed(1) + '%;--y:' + r(4, 90).toFixed(1) + '%;--s:' + sz.toFixed(0) + 'px;--o:' + r(0.55, 0.95).toFixed(2) + ';--d:' + (cfg.d * r(0.7, 1.5)).toFixed(1) + 's;--dl:-' + r(0, cfg.d).toFixed(1) + 's;--dx:' + r(-90, 90).toFixed(0) + 'px;--rot:' + r(180, 720).toFixed(0) + 'deg';
      if (cfg.mode === 'burst') {
        p.style.setProperty('--x', r(8, 92).toFixed(1) + '%'); p.style.setProperty('--y', r(8, 55).toFixed(1) + '%');
        var col = COLORS[Math.floor(Math.random() * COLORS.length)], radius = r(60, 130), sparks = 18;
        for (var q = 0; q < sparks; q++) {
          var b = document.createElement('b'), a = (q / sparks) * Math.PI * 2;
          b.style.cssText = '--c:' + col + ';--s:6px;--tx:' + (Math.cos(a) * radius).toFixed(0) + 'px;--ty:' + (Math.sin(a) * radius + 18).toFixed(0) + 'px;--d:2.2s;--dl:' + (-r(0, cfg.d)).toFixed(1) + 's';
          p.append(b);
        }
        p.style.left = 'var(--x)';
      }
      layer.append(p);
    }
    return n;
  }
  root.TwFx = { KINDS: KINDS, render: render };
})(window);

var layer=document.getElementById('fx'),cur=location.hash.slice(1)||'anhdao';
function go(k){cur=k;TwFx.render(layer,k,parseFloat(document.getElementById('amt').value),innerWidth<760);document.querySelectorAll('.bar button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.k===k))});try{history.replaceState(null,'','#'+k)}catch(e){}}
document.querySelectorAll('.bar button').forEach(function(b){b.onclick=function(){go(b.dataset.k)}});document.getElementById('amt').onchange=function(){go(cur)};
document.addEventListener('visibilitychange',function(){layer.classList.toggle('paused',document.hidden)});go(cur);
</script></body></html>
