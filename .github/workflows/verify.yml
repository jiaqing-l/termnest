name: Verify native Termnest
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['validation/**']
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.98.0'
  CARGO_BUILD_JOBS: '2'
jobs:
  desktop:
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: Termnest-Setup.exe
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: Termnest-arm64.dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: Termnest-x64.dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            artifact: Termnest-amd64.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Isolate Windows temporary fixtures with a private current-user ACL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'termnest-private-fixtures'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = [Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($sid)
          $acl.SetAccessRuleProtection($true, $false)
          foreach ($id in @($sid.Value, 'S-1-5-18', 'S-1-5-32-544')) {
            $rule = [Security.AccessControl.FileSystemAccessRule]::new([Security.Principal.SecurityIdentifier]::new($id), 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
            $acl.AddAccessRule($rule)
          }
          Set-Acl -LiteralPath $fixture -AclObject $acl
          "TEMP=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install macOS native tmux dependency
        if: runner.os == 'macOS'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xvfb dbus-x11 tmux
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --target '${{ matrix.target }}'
      - uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cargo/registry
            desktop/target
          key: rust-${{ matrix.target }}-1.98.0-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Tests and resource payload
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/termnest-validation"
          npm test 2>&1 | tee "$RUNNER_TEMP/termnest-validation/unit.log"
          npm run prepare:desktop
          npm ci --prefix desktop --no-audit --no-fund
      - name: Compile and test native shell
        working-directory: desktop
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          cargo test --locked --target '${{ matrix.target }}' -j 2 2>&1 | tee "$RUNNER_TEMP/termnest-validation/cargo.log"
          npm run build -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundle }}' --ci -- --locked
      - name: Install Windows and smoke installed native shell and PTY
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $destination = "$env:RUNNER_TEMP\Termnest"
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          New-Item -ItemType Directory -Force packaging/out | Out-Null
          Copy-Item $installers[0].FullName packaging/out/Termnest-Setup.exe
          node packaging/check-payload.js "$destination/app" packaging/out/Termnest-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Payload check failed' }
          node packaging/desktop-smoke.js "$destination/Termnest.exe" "$destination/app" "$destination/app/node.exe" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/termnest-validation/smoke.log"
          if ($LASTEXITCODE -ne 0) { throw 'Installed shell/PTY smoke failed' }
      - name: Install macOS DMG and smoke installed native shell and PTY
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmgs=(desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          mount="$RUNNER_TEMP/termnest-mounted"
          mkdir -p "$mount" "$RUNNER_TEMP/installed" packaging/out
          hdiutil attach "${dmgs[0]}" -mountpoint "$mount" -nobrowse -readonly
          trap 'hdiutil detach "$mount"' EXIT
          test -L "$mount/Applications"
          ditto "$mount/Termnest.app" "$RUNNER_TEMP/installed/Termnest.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/installed/Termnest.app"
          app="$RUNNER_TEMP/installed/Termnest.app/Contents"
          cp "${dmgs[0]}" 'packaging/out/${{ matrix.artifact }}'
          node packaging/check-payload.js "$app/Resources/app" 'packaging/out/${{ matrix.artifact }}'
          case "$(uname -m)" in arm64) native=arm64 ;; *) native=x64 ;; esac
          node packaging/desktop-smoke.js "$app/MacOS/Termnest" "$app/Resources/app" "$app/Resources/app/node-$native" 2>&1 | tee "$RUNNER_TEMP/termnest-validation/smoke.log"
          if [ "$native" = arm64 ] && arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$app/Resources/app/node-x64" packaging/smoke.js "$app/Resources/app" "$app/Resources/app/node-x64"
          fi
      - name: Install Linux .deb and smoke installed native shell and PTY
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          debs=(desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          mkdir -p packaging/out
          cp "${debs[0]}" 'packaging/out/${{ matrix.artifact }}'
          sudo apt-get install -y --no-install-recommends "./packaging/out/${{ matrix.artifact }}"
          package="$(dpkg-deb -f 'packaging/out/${{ matrix.artifact }}' Package)"
          launcher="$(dpkg -L "$package" | grep '/app/launcher.js$')"
          test -n "$launcher"
          app="$(dirname "$launcher")"
          binary="$(dpkg -L "$package" | grep '^/usr/bin/' | head -n 1)"
          test -x "$binary"
          node packaging/check-payload.js "$app" 'packaging/out/${{ matrix.artifact }}'
          export WEBKIT_DISABLE_DMABUF_RENDERER=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 GDK_BACKEND=x11
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' node packaging/desktop-smoke.js "$binary" "$app" "$app/node-x64" 2>&1 | tee "$RUNNER_TEMP/termnest-validation/smoke.log"
      # Logs only from controlled CI fixtures; never upload home, DATA, vaults, secrets or installers.
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: Native-validation-${{ matrix.target }}
          path: ${{ runner.temp }}/termnest-validation/*.log
          if-no-files-found: warn
          retention-days: 7
